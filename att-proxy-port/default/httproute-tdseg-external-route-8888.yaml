apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tdseg-external-route-8888
  namespace: default
spec:
  hostnames:
    - tdseg-test.att.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway
      sectionName: https-tdseg-8888
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: waf-backend-443
          weight: 1
      filters:
        - requestHeaderModifier:
            set:
              - name: incoming-port
                value: "8888"
              - name: incoming-host
                value: tdseg-test.att.com
          type: RequestHeaderModifier
      matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 120s
