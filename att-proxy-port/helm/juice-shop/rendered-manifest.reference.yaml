apiVersion: v1
kind: Service
metadata:
  name: juice-shop
  labels:
    helm.sh/chart: juice-shop-5.8.0
    app.kubernetes.io/name: juice-shop
    app.kubernetes.io/instance: juice-shop
    app.kubernetes.io/version: "v20.1.1"
    app.kubernetes.io/managed-by: Helm
  annotations:
    {}
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: juice-shop
    app.kubernetes.io/instance: juice-shop
---
# Source: juice-shop/templates/deployment.yaml
# SPDX-FileCopyrightText: the secureCodeBox authors
#
# SPDX-License-Identifier: Apache-2.0

apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  labels:
    helm.sh/chart: juice-shop-5.8.0
    app.kubernetes.io/name: juice-shop
    app.kubernetes.io/instance: juice-shop
    app.kubernetes.io/version: "v20.1.1"
    app.kubernetes.io/managed-by: Helm
  annotations:
    {}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: juice-shop
      app.kubernetes.io/instance: juice-shop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: juice-shop
        app.kubernetes.io/instance: juice-shop
      annotations:
        {}
    spec:
      securityContext:
        {}
      containers:
        - name: juice-shop
          env:
            []
          securityContext:
            {}
          image: "docker.io/bkimminich/juice-shop:v20.1.1"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
            failureThreshold: 30
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {}
          volumeMounts:
            []
      volumes:
        []
---
