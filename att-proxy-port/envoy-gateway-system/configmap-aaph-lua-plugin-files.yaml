apiVersion: v1
data:
  aaph.lua: "local function read_request_body(request_handle)\n  local MAX_BODY_SIZE = 64 * 1024  -- in Bytes\n  local body = request_handle:body()\n  if body then\n    local body_len = body:length()\n\n    -- Limit the request body to MAX_BODY_SIZE\n    local max_bytes = math.min(body_len, MAX_BODY_SIZE)\n    local body_text = body:getBytes(0, max_bytes)\n    return body_text\n  end\n\n  return nil\nend\n\nlocal function split(inputstr, delimiter)\n  local result = {}\n  for match in (inputstr .. delimiter):gmatch(\"(.-)\" .. delimiter) do\n      table.insert(result, match)\n  end\n\n  return result\nend\n\nlocal function get_headers(request_handle)\n  local request_headers = request_handle:headers()\n  local request_headers_map = {}\n  for k, v in pairs(request_headers) do\n    -- Omitting the headers added by envoy [This is a performance optimization]\n    if not string.match(k:lower(), \"^x%-envoy%-.*\") and k:lower() ~= \"x-forwarded-proto\" then\n      request_headers_map[k] = v\n    end\n  end\n\n  local stream_info = request_handle:streamInfo()\n  if stream_info then\n    request_headers_map[\"X-Forward-Proto\"] = stream_info:protocol()\n  end\n\n  local server = request_handle:streamInfo():downstreamLocalAddress()\n  if server then\n    local parts = split(server, \":\")\n    request_headers_map[\"X-Server-Port\"] = parts[#parts]\n  end\n\n  local client = request_handle:streamInfo():downstreamRemoteAddress()\n  if client then\n    local parts = split(client, \":\")\n    request_headers_map[\"X-Forward-Port\"] = parts[#parts]\n  end\n\n  -- X-Original-Protocol header is not being created as Envoy sets req.Proto to the correct value\n  return request_headers_map\nend\n\nlocal function is_grpc_request(request_handle)\n  local headers = request_handle:headers()\n  local method = headers:get(\":method\")\n  local content_type = headers:get(\"content-type\")\n  local protocol = request_handle:streamInfo():protocol()\n\n  -- Quick pre-check: Must be POST + HTTP/2 + gRPC content-type\n  if method ~= \"POST\" or (protocol and protocol ~= \"HTTP/2\") or not (content_type and string.find(content_type:lower(), \"application/grpc\")) then\n      return false\n  end\n  \n  -- If basic requirements met, check additional indicators for confirmation\n  local grpc_indicators = 3  -- Start with 3 (POST + HTTP/2 + content-type)\n\n  -- 4. Check for TE: trailers header (gRPC specific)\n  local te_header = headers:get(\"te\")\n  if te_header and string.find(te_header:lower(), \"trailers\") then\n    grpc_indicators = grpc_indicators + 2\n  end\n\n  -- 5. Check User-Agent for gRPC libraries (optional)\n  local user_agent = headers:get(\"user-agent\")\n  if user_agent and (string.find(user_agent:lower(), \"grpc\") or string.find(user_agent:lower(), \"protobuf\")) then\n    grpc_indicators = grpc_indicators + 1\n  end\n  \n  -- 6. Check URI patterns common in gRPC services\n  local path = headers:get(\":path\")\n  -- gRPC services often follow patterns like /package.Service/Method\n  if path and string.match(path, \"^/[%w%.]+/[%w%.]+$\") then\n    grpc_indicators = grpc_indicators + 1\n  end\n  \n  -- Check if we have enough indicators (at least 4)\n  if grpc_indicators >= 4 then\n    request_handle:logDebug(\"Detected gRPC request based on indicators: \" .. grpc_indicators)\n    return true\n  else\n    request_handle:logInfo(\"Potential gRPC request but insufficient indicators: \" .. grpc_indicators .. \" (need at least 4)\")\n    return false\n  end\nend\n\n-- Function to determine if request body should be read\nlocal function should_read_body(request_handle, method, content_length)\n    -- Skip body reading for gRPC requests\n    if is_grpc_request(request_handle) then\n        return false\n    end\n    \n    -- Always read body for PUT and POST methods\n    if method == \"PUT\" or method == \"POST\" then\n        return true\n    end\n    \n    -- For other methods (GET, OPTIONS, DELETE, PATCH, etc.), \n    -- only read body if content-length header is present and > 0\n    if content_length and content_length > 0 then\n        return true\n    end\n    \n    return false\nend\n\nfunction envoy_on_request(request_handle)\n  local start_time = os.time() + (os.clock() % 1)  -- Gives time with millisecond precision\n  local request_headers_map = get_headers(request_handle)\n  local method = request_handle:headers():get(\":method\")\n  local content_length_str = request_handle:headers():get(\"content-length\")\n  local content_length = content_length_str and tonumber(content_length_str) or nil\n  local body_data = nil\n  -- Determine if we should read the request body\n  if should_read_body(request_handle, method, content_length) then\n    body_data = read_request_body(request_handle)\n  end\n\n  if not body_data then\n    request_handle:logDebug(\"No body data found, setting content length to 0\")\n    request_headers_map[\"content-length\"] = 0\n  else\n    if content_length and content_length ~= #body_data then\n      request_handle:logDebug(\"Request Body truncated: content length (\" .. content_length .. \"), truncated body length (\" .. #body_data .. \")\")\n      request_headers_map[\"x-original-content-length\"] = content_length\n    end\n    request_headers_map[\"content-length\"] = #body_data\n  end\n\n  local res, headers = pcall(function()\n    return request_handle:httpCall(\n      \"aaph-protector\",\n      request_headers_map,\n      body_data,\n      2000\n    )\n  end)\n\n  local req_id_header = \"X-Request-ID\"\n  local request_id = request_handle:headers():get(req_id_header:lower()) or \"Unknown\"\n  if not res then\n    request_handle:logErr(\"Failed to request: \" .. request_id)\n    return  -- Fail open: do not block the request, allow it to proceed\n  end\n\n  -- Copy response headers with prefix \"Akamai-X\"\n  local response_headers = {}\n  local akamai_x_headers = {}\n  for k, v in pairs(headers) do\n    response_headers[k] = v\n    if string.match(k:lower(), \"^akamai%-x%-.*\") then\n      akamai_x_headers[k] = v\n    end\n  end\n\n  local status = response_headers[\":status\"]\n  request_handle:logDebug(\"aaph response status: \" .. status)\n\n  if status == \"403\" then\n    request_handle:respond(response_headers, \"\")\n  end\n\n  -- Set KeepAlive\n\n  -- Send out akamai headers if present even in case of success.\n  request_handle:streamInfo():dynamicMetadata():set(\"authz-headers\", \"akamai-x-headers\", akamai_x_headers)\n\n  local end_time = os.time() + (os.clock() % 1)\n  request_handle:logInfo(\"Request ID: \" .. request_id .. \", time taken by aaph rewrite:\" .. end_time-start_time)\nend\n\nfunction envoy_on_response(response_handle)\n  local metadata = response_handle:streamInfo():dynamicMetadata():get(\"authz-headers\")\n  if metadata and metadata[\"akamai-x-headers\"] then\n    for key, value in pairs(metadata[\"akamai-x-headers\"]) do\n    response_handle:headers():add(key, value)\n    end\n  end\nend\n"
