apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cpr-external-route-443
  namespace: envoy-gateway-system
spec:
  hostnames:
    - cpr-test.att.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway
      sectionName: https-cprtest-443
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: waf-backend-cpr-443
          weight: 1
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: aka-cpr-test.att.com
        - requestHeaderModifier:
            set:
              - name: incoming-port
                value: "443"
              - name: incoming-host
                value: cpr-test.att.com
              - name: client-ip
                value: '%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%'
          type: RequestHeaderModifier
      matches:
        - path:
            type: PathPrefix
            value: /
