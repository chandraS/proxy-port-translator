apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: waf-backend-apps-443
  namespace: envoy-gateway-system
spec:
  endpoints:
    - fqdn:
        hostname: aka-apps.wholesale.att.com
        port: 443
  tls:
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: apps-wholesale-att-com-upstream-ca-cert
    insecureSkipVerify: false
    sni: aka-apps.wholesale.att.com
  type: Endpoints
