apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-svc
  namespace: envoy-gateway-system
spec:
  hostnames:
    - aaph.backend.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway
      sectionName: http
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: app-svc
          namespace: origin
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
