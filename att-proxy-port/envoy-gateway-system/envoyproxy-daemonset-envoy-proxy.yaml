apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: daemonset-envoy-proxy
  namespace: envoy-gateway-system
spec:
  logging:
    level:
      default: warn
  provider:
    kubernetes:
      envoyDaemonSet:
        pod:
          annotations:
            prometheus.io/port: "19001"
            prometheus.io/scrape: "true"
        strategy:
          type: RollingUpdate
    type: Kubernetes
