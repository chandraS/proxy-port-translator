apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: juice-shop
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway
      sectionName: http
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: juice-shop
          namespace: origin
          port: 3000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
