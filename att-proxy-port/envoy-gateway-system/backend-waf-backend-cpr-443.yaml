apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: waf-backend-cpr-443
  namespace: envoy-gateway-system
spec:
  endpoints:
    - fqdn:
        hostname: aka-cpr-test.att.com
        port: 443
  tls:
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: cprtest-upstream-ca-cert
    insecureSkipVerify: false
    sni: aka-cpr-test.att.com
  type: Endpoints
